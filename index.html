<body>
  <header class="topbar">
    <div class="brand"><div class="brand-mark">H</div><div><h1>海航英语真题题库</h1><small>350 题 · 离线互动练习</small></div></div>
    <div class="top-actions"><button class="top-btn" id="homeBtn" type="button">首页</button><button class="top-btn" id="archiveBtn" type="button">错题<span>归档</span></button></div>
  </header>

  <main class="container">
    <section id="homeView">
      <div class="hero">
        <div><div class="eyebrow">Cabin Crew English Practice</div><h2>把每一道真题，<br>练成你的底气。</h2><p>七套海航乘务员及安全员招聘英语真题，支持按套顺序练习与全题随机。答案即时反馈，错题自动归档。</p></div>
        <div class="hero-stats"><div class="hero-stat"><strong>7</strong><span>套历年真题</span></div><div class="hero-stat"><strong>350</strong><span>道三选一试题</span></div><div class="hero-stat"><strong>2</strong><span>种练习模式</span></div><div class="hero-stat"><strong>100%</strong><span>离线可用</span></div></div>
      </div>
      <div id="continueCard" class="continue-card hidden"><div><h4>继续上次练习</h4><p id="continueText"></p></div><button class="primary" id="continueBtn" type="button">继续作答</button></div>
      <div class="section-head"><div><h3>选择练习方式</h3><p>按原卷顺序作答，或混合全部题目随机练习</p></div></div>
      <div class="mode-grid" id="modeGrid"></div>
    </section>

    <section id="quizView" class="hidden">
      <div class="quiz-shell">
        <article class="quiz-main">
          <div class="quiz-header"><div><div class="quiz-title" id="quizTitle"></div><div class="quiz-subtitle" id="quizSubtitle"></div></div><div class="progress-wrap"><div class="progress-label" id="progressLabel"></div><div class="progress-track"><div class="progress-fill" id="progressFill"></div></div></div></div>
          <div class="question-area"><div class="question-meta"><span class="question-number" id="questionNumber"></span><span class="source-label" id="sourceLabel"></span></div><h2 class="question-text" id="questionText"></h2><div class="options" id="options"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div></div>
          <div class="quiz-footer"><button class="ghost mobile-palette-btn" id="paletteBtn" type="button">题卡</button><div class="footer-group"><button class="secondary" id="prevBtn" type="button">上一题</button><button class="primary" id="confirmBtn" type="button" disabled>确认并查看答案</button><button class="primary hidden" id="nextBtn" type="button">下一题</button></div><button class="ghost" id="finishBtn" type="button">结束本次练习</button></div>
        </article>
        <aside class="quiz-sidebar" id="quizSidebar"><div class="stat-row"><div class="mini-stat"><strong id="answeredStat">0</strong><span>已答</span></div><div class="mini-stat"><strong id="correctStat">0</strong><span>正确</span></div><div class="mini-stat"><strong id="wrongStat">0</strong><span>错题</span></div></div><div class="palette-head"><h4>答题卡</h4><span>点击跳转</span></div><div class="palette" id="palette"></div><div class="legend"><span><i style="background:#11845b"></i>正确</span><span><i style="background:#c43b45"></i>错误</span><span><i style="background:#edf5ff;border:1px solid #1769e0"></i>当前</span></div><div class="side-actions"><button class="ghost" id="sidebarCloseBtn" type="button">收起题卡</button><button class="danger" id="sideFinishBtn" type="button">结束本次练习</button></div></aside>
      </div>
      <div class="sheet-overlay" id="sheetOverlay"></div>
    </section>

    <section id="resultView" class="hidden"><div class="result-card"><div class="score-ring" id="scoreRing"><div><strong id="scorePercent"></strong><span>正确率</span></div></div><h2 id="resultTitle"></h2><p id="resultMessage"></p><div class="result-stats"><div class="result-stat"><strong id="resultAnswered"></strong><span>完成题数</span></div><div class="result-stat"><strong id="resultCorrect"></strong><span>答对</span></div><div class="result-stat"><strong id="resultWrong"></strong><span>错题</span></div></div><div class="result-actions"><button class="primary" id="retryWrongBtn" type="button">重练本次错题</button><button class="secondary" id="resultArchiveBtn" type="button">查看错题归档</button><button class="ghost" id="resultHomeBtn" type="button">返回首页</button></div></div></section>

  <script>

    const KEYS={history:'hainanEnglishHistoryV1',current:'hainanEnglishCurrentV1'};
    const LETTERS=['A','B','C'];
    const questionMap=new Map(DATA.sets.flatMap(s=>s.questions).map(q=>[q.id,q]));
    const $=id=>document.getElementById(id);
    const views=['homeView','quizView','resultView','archiveView'];
    let session=null,lastResult=null,toastTimer=null;

    function readJSON(key,fallback){try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}}
    function saveJSON(key,value){localStorage.setItem(key,JSON.stringify(value))}
    function shuffle(items){const a=[...items];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
    function showView(id){views.forEach(v=>$(v).classList.toggle('hidden',v!==id));closePalette();window.scrollTo({top:0,behavior:'smooth'})}
    function toast(message){$('toast').textContent=message;$('toast').classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.remove('show'),2200)}
    function formatDate(value){return new Intl.DateTimeFormat('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(value))}
    function getHistory(){return readJSON(KEYS.history,[])}
    function setHistory(items){saveJSON(KEYS.history,items)}

    function buildHome(){
      const grid=$('modeGrid');grid.innerHTML='';
      DATA.sets.forEach(set=>{const b=document.createElement('button');b.className='mode-card';b.innerHTML=`<span class="tag">顺序练习</span><h4>${set.title}</h4><p>50 道题 · 保留原卷顺序</p>`;b.onclick=()=>startSet(set.id);grid.appendChild(b)});
      const random=document.createElement('button');random.className='mode-card random';random.innerHTML='<span class="tag">完全打乱</span><h4>全部随机练习</h4><p>混合七套 · 350 道题重新洗牌</p>';random.onclick=startRandom;grid.appendChild(random);
      const saved=readJSON(KEYS.current,null);const valid=saved&&Array.isArray(saved.order)&&saved.order.every(id=>questionMap.has(id));
      $('continueCard').classList.toggle('hidden',!valid);if(valid){const answered=Object.keys(saved.answers||{}).length;$('continueText').textContent=`${saved.title} · 已完成 ${answered}/${saved.order.length} 题`}
    }
    function newSession(title,mode,order){session={id:'attempt-'+Date.now(),title,mode,order,index:0,answers:{},startedAt:new Date().toISOString(),archived:false};persistSession();showView('quizView');renderQuiz()}
    function startSet(id){const set=DATA.sets.find(s=>s.id===id);newSession(set.title,'set',set.questions.map(q=>q.id))}
    function startRandom(){newSession('全部随机练习','random',shuffle(DATA.sets.flatMap(s=>s.questions).map(q=>q.id)))}
    function startWrongPractice(ids,title='错题强化练习'){const valid=[...new Set(ids)].filter(id=>questionMap.has(id));if(!valid.length){toast('目前没有可练习的错题');return}newSession(title,'wrong',shuffle(valid))}
    function persistSession(){if(session)saveJSON(KEYS.current,session)}
    function currentQuestion(){return questionMap.get(session.order[session.index])}
    function stats(){const rows=Object.values(session.answers);return{answered:rows.filter(a=>a.confirmed).length,correct:rows.filter(a=>a.confirmed&&a.correct).length,wrong:rows.filter(a=>a.confirmed&&!a.correct).length}}

    function renderQuiz(){
      const q=currentQuestion(),record=session.answers[q.id]||{},s=stats();
      $('quizTitle').textContent=session.title;$('quizSubtitle').textContent=session.mode==='random'?'每次开始都会重新打乱顺序':session.mode==='wrong'?'来自你的历史错题':'按照原套题顺序作答';
      $('questionNumber').textContent=`第 ${session.index+1} 题`;$('sourceLabel').textContent=`第${q.setId}套 · 原题 ${q.number}`;$('questionText').textContent=q.stem;
      $('progressLabel').textContent=`已完成 ${s.answered} / ${session.order.length}`;$('progressFill').style.width=`${s.answered/session.order.length*100}%`;
      $('answeredStat').textContent=s.answered;$('correctStat').textContent=s.correct;$('wrongStat').textContent=s.wrong;
      const box=$('options');box.innerHTML='';q.options.forEach((text,index)=>{const letter=LETTERS[index],b=document.createElement('button');b.type='button';b.className='option';b.disabled=!!record.confirmed;b.innerHTML=`<span class="option-letter">${letter}</span><span>${escapeHTML(text)}</span><span class="option-mark"></span>`;if(record.selected===letter)b.classList.add('selected');if(record.confirmed){if(letter===q.answer){b.classList.add('correct');b.querySelector('.option-mark').textContent='✓'}else if(letter===record.selected){b.classList.add('wrong');b.querySelector('.option-mark').textContent='×'}}b.onclick=()=>selectOption(letter);box.appendChild(b)});
      const feedback=$('feedback');feedback.className='feedback hidden';if(record.confirmed){feedback.className=`feedback ${record.correct?'correct':'wrong'}`;feedback.textContent=record.correct?`回答正确，答案是 ${q.answer}。`:`回答错误。你选择了 ${record.selected}，正确答案是 ${q.answer}。`}
      $('confirmBtn').disabled=!record.selected;$('confirmBtn').classList.toggle('hidden',!!record.confirmed);$('nextBtn').classList.toggle('hidden',!record.confirmed);$('nextBtn').textContent=session.index===session.order.length-1?'查看结果':'下一题';$('prevBtn').disabled=session.index===0;
      renderPalette();persistSession();
    }
    function escapeHTML(value){const d=document.createElement('div');d.textContent=value;return d.innerHTML}
    function selectOption(letter){const q=currentQuestion(),r=session.answers[q.id]||{};if(r.confirmed)return;session.answers[q.id]={...r,selected:letter,confirmed:false};renderQuiz()}
    function confirmAnswer(){const q=currentQuestion(),r=session.answers[q.id];if(!r?.selected)return;session.answers[q.id]={...r,confirmed:true,correct:r.selected===q.answer};renderQuiz()}
    function go(delta){const next=session.index+delta;if(next>=session.order.length){finishSession(false);return}if(next<0)return;session.index=next;renderQuiz();window.scrollTo({top:0,behavior:'smooth'})}
    function renderPalette(){const p=$('palette');p.innerHTML='';session.order.forEach((id,i)=>{const r=session.answers[id],b=document.createElement('button');b.type='button';b.className='q-dot';b.textContent=i+1;if(i===session.index)b.classList.add('current');if(r?.confirmed)b.classList.add(r.correct?'correct':'wrong');b.onclick=()=>{session.index=i;renderQuiz();closePalette()};p.appendChild(b)})}
    function openPalette(){$('quizSidebar').classList.add('open');$('sheetOverlay').classList.add('open')}
    function closePalette(){$('quizSidebar').classList.remove('open');$('sheetOverlay').classList.remove('open')}

    function archiveSession(){
      if(!session||session.archived)return null;const s=stats(),wrong=Object.entries(session.answers).filter(([,a])=>a.confirmed&&!a.correct).map(([questionId,a])=>({questionId,selected:a.selected}));
      const item={id:session.id,date:new Date().toISOString(),title:session.title,mode:session.mode,total:session.order.length,answered:s.answered,correct:s.correct,wrong};const history=getHistory();history.unshift(item);setHistory(history);session.archived=true;return item;
    }
    function finishSession(ask=true){if(!session)return;const s=stats();if(ask&&!confirm(`已完成 ${s.answered}/${session.order.length} 题，确定结束并归档本次错题吗？`))return;const item=archiveSession();localStorage.removeItem(KEYS.current);lastResult=item||{title:session.title,total:session.order.length,answered:s.answered,correct:s.correct,wrong:[]};session=null;renderResult(lastResult)}
    function renderResult(item){showView('resultView');const answered=item.answered||0,correct=item.correct||0,wrong=item.wrong?.length||0,pct=answered?Math.round(correct/answered*100):0;$('scoreRing').style.setProperty('--score',pct+'%');$('scorePercent').textContent=pct+'%';$('resultTitle').textContent=wrong?'本次练习已归档':'本次练习完成';$('resultMessage').textContent=answered?`你完成了 ${answered} 道题，继续保持稳定的练习节奏。`:'本次尚未作答，记录已保存。';$('resultAnswered').textContent=answered;$('resultCorrect').textContent=correct;$('resultWrong').textContent=wrong;$('retryWrongBtn').disabled=!wrong}

    function renderArchive(){
      showView('archiveView');const history=getHistory(),content=$('archiveContent');$('practiceAllWrongBtn').disabled=!history.some(h=>h.wrong?.length);$('clearArchiveBtn').disabled=!history.length;
      if(!history.length){content.innerHTML='<div class="empty"><strong>还没有错题记录</strong><br>完成一次练习后，错题会自动出现在这里。</div>';return}
      content.innerHTML='<div class="session-list"></div>';const list=content.firstElementChild;
      history.forEach(item=>{const card=document.createElement('article');card.className='archive-card';const pct=item.answered?Math.round(item.correct/item.answered*100):0;card.innerHTML=`<div class="session-summary"><div><div class="session-title">${escapeHTML(item.title)}</div><div class="session-meta">${formatDate(item.date)} · 完成 ${item.answered}/${item.total} 题 · 错题 ${item.wrong.length}</div></div><div class="session-score"><strong>${pct}%</strong><span>正确率</span></div><div class="session-buttons"><button class="secondary detail-btn" type="button">查看错题</button><button class="primary retry-btn" type="button" ${item.wrong.length?'':'disabled'}>错题重练</button><button class="danger delete-btn" type="button">删除</button></div></div><div class="session-detail hidden"></div>`;
        const detail=card.querySelector('.session-detail');card.querySelector('.detail-btn').onclick=()=>{const hidden=detail.classList.toggle('hidden');if(!hidden)renderWrongDetail(detail,item);card.querySelector('.detail-btn').textContent=hidden?'查看错题':'收起'};card.querySelector('.retry-btn').onclick=()=>startWrongPractice(item.wrong.map(w=>w.questionId),`${item.title} · 错题重练`);card.querySelector('.delete-btn').onclick=()=>{if(confirm('确定删除这次练习记录吗？')){setHistory(getHistory().filter(h=>h.id!==item.id));renderArchive()}};list.appendChild(card)});
    }
    function renderWrongDetail(container,item){if(!item.wrong.length){container.innerHTML='<div class="empty">本次没有错题。</div>';return}container.innerHTML='<div class="wrong-list"></div>';const list=container.firstElementChild;item.wrong.forEach(w=>{const q=questionMap.get(w.questionId);if(!q)return;const div=document.createElement('div');div.className='wrong-item';div.innerHTML=`<h5>第${q.setId}套 · 原题 ${q.number}　${escapeHTML(q.stem)}</h5><div class="answer-line"><span class="bad">你的答案：${w.selected} · ${escapeHTML(q.options[LETTERS.indexOf(w.selected)]||'')}</span><span class="good">正确答案：${q.answer} · ${escapeHTML(q.options[LETTERS.indexOf(q.answer)])}</span></div>`;list.appendChild(div)})}
    function goHome(){if(session){const s=stats();if(!confirm(`当前练习已完成 ${s.answered}/${session.order.length} 题。返回首页后仍可继续，确定返回吗？`))return;persistSession();session=null}buildHome();showView('homeView')}

    $('homeBtn').onclick=goHome;$('archiveBtn').onclick=()=>{if(session&&!confirm('当前进度已自动保存，确定打开错题归档吗？'))return;if(session){persistSession();session=null}renderArchive()};$('continueBtn').onclick=()=>{session=readJSON(KEYS.current,null);showView('quizView');renderQuiz()};$('confirmBtn').onclick=confirmAnswer;$('nextBtn').onclick=()=>go(1);$('prevBtn').onclick=()=>go(-1);$('finishBtn').onclick=()=>finishSession(true);$('sideFinishBtn').onclick=()=>finishSession(true);$('paletteBtn').onclick=openPalette;$('sidebarCloseBtn').onclick=closePalette;$('sheetOverlay').onclick=closePalette;$('resultHomeBtn').onclick=goHome;$('resultArchiveBtn').onclick=renderArchive;$('retryWrongBtn').onclick=()=>lastResult&&startWrongPractice(lastResult.wrong.map(w=>w.questionId),'本次错题重练');$('practiceAllWrongBtn').onclick=()=>startWrongPractice(getHistory().flatMap(h=>h.wrong.map(w=>w.questionId)),'历史错题强化练习');$('clearArchiveBtn').onclick=()=>{if(confirm('确定清空全部错题归档吗？此操作无法撤销。')){setHistory([]);renderArchive();toast('错题归档已清空')}};
    window.addEventListener('beforeunload',()=>{if(session)persistSession()});buildHome();
  </script>
</body>
</html>
